<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESSSSSTTTTTTT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200">
        <!-- Icon -->
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Test-Seite</h1>
        
        <!-- Description -->
        <p class="text-slate-600 mb-6">
            Diese HTML-Datei wurde erfolgreich erstellt und dient als Testumgebung.
        </p>

        <!-- Interactive Button -->
        <button id="testBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition duration-200 ease-in-out transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            Klick mich!
        </button>

        <!-- Output Message Box -->
        <div id="outputBox" class="mt-4 p-4 rounded-xl bg-slate-50 text-slate-700 hidden border border-slate-200">
            <p id="outputText" class="text-sm font-medium"></p>
        </div>
    </div>

    <script>
        // Interactive Logic
        const testBtn = document.getElementById('testBtn');
        const outputBox = document.getElementById('outputBox');
        const outputText = document.getElementById('outputText');

        let clickCount = 0;

        testBtn.addEventListener('click', () => {
            clickCount++;
            outputBox.classList.remove('hidden');
            outputText.textContent = `Der Button wurde ${clickCount}x geklickt! 🎉`;
        });
    </script>
</body>
</html>
